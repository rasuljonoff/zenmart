<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenmart</title>
    <link rel="stylesheet" href="./css/command.css" />
    <link rel="stylesheet" href="./css/home.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navbar_frame">
        <div class="container">
            <div class="navbar_top">
                <a href="homepage1.html">
                    <img src="./images/icons/logo.png" alt="Zenmart logo" />
                </a>

                <div class="nav_search_frame">
                    <div class="search_box">
                        <div class="category_list">
                            <select name="category" id="category">
                                <option value="all" selected>All Categories</option>
                                <option value="com">Computers</option>
                                <option value="head">Headphones</option>
                            </select>
                        </div>
                        <input type="text" placeholder="search products..." />
                    </div>
                    <div class="search_icon_box">
                        <img src="./images/icons/search.svg" alt="Search" />
                    </div>
                </div>

                <div class="nav_top_menu">
                    <div class="top_menu_box">
                        <div class="icon_box">
                            <img src="./images/icons/heart.svg" alt="Wishlist" />
                        </div>
                        <div class="info_box">
                            <span>Wishlist</span>
                            <strong>My Items</strong>
                        </div>
                    </div>

                    <div class="top_menu_box">
                        <div class="icon_box">
                            <img src="./images/icons/profile.svg" alt="Account" />
                        </div>
                        <div class="info_box">
                            <span>Sign In</span>
                            <strong>Account</strong>
                        </div>
                    </div>

                    <div class="top_menu_box">
                        <div class="icon_box">
                            <div class="basket_count">2</div>
                            <img src="./images/icons/shopping-cart.svg" alt="Cart" />
                        </div>
                        <div class="info_box">
                            <span>$399.99</span>
                            <strong>Total</strong>
                        </div>
                    </div>
                </div>
            </div>

            <div class="navbar_bott">
                <div class="navbat_bott_menu_box">
                    <div class="browse_box">
                        <img src="./images/icons/browse.svg" alt="Categories" />
                        <span>Browse Categories</span>
                    </div>

                    <div class="navbar_route_menu">
                        <a href="homepage1.html" class="title">Home</a>
                        <a href="shop.html">Shop</a>
                        <a href="orders.html">Orders</a>
                        <a href="about.html">About</a>
                        <a href="contact.html">Contact</a>
                    </div>

                    <div class="sorting_menu">
                        <span>Deal of the Day</span>
                        <span>Hot Deals</span>
                        <span>Best Sellers</span>
                        <span>New Arriwals</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
